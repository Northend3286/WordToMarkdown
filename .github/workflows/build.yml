name: Build WordToMarkdown

on:
  push:
    branches: [ WordToMD, master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller

      - name: Install Pandoc (Windows)
        if: runner.os == 'Windows'
        run: choco install pandoc -y

      - name: Install Pandoc (Mac)
        if: runner.os == 'macOS'
        run: brew install pandoc

      - name: Build executable
        run: |
          pyinstaller -F WordToMarkdown.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordToMarkdown-${{ runner.os }}
          path: dist/*
